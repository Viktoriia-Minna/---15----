<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f2" />
    <title>Пошук країн</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="country-search" aria-labelledby="page-title">
        <p class="eyebrow">Довідник світу</p>
        <h1 id="page-title">Пошук країн</h1>
        <label class="search-label" for="country-search-input">
          Назва країни
        </label>
        <input
          id="country-search-input"
          class="search-input"
          type="search"
          name="country"
          placeholder="Наприклад, Ukraine"
          autocomplete="off"
          aria-describedby="search-status"
        />
        <p id="search-status" class="search-status" aria-live="polite"></p>
        <ul id="country-list" class="country-list"></ul>
        <section
          id="country-details"
          class="country-details"
          aria-live="polite"
          aria-label="Інформація про країну"
        ></section>
      </section>
    </main>
  </body>
</html>
